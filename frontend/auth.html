<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auth - Watchroom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-shell">
    <section class="auth-side">
      <div class="auth-side-top">
        <a href="index.html" class="logo">
          <span class="logo-mark"></span>
          Watchroom
        </a>
      </div>
      <div class="auth-quote">
        <p>Мы смотрели финал в трёх разных городах — и всё равно вскрикнули в один момент</p>
      </div>
    </section>

    <section class="auth-form-side">
      <div class="auth-box">
        <div class="auth-tabs">
          <button class="auth-tab active" type="button">Вход</button>
          <button class="auth-tab" type="button">Регистрация</button>
        </div>

        <h1>С возвращением</h1>
        <p class="auth-sub">Войдите, чтобы открыть свои комнаты и историю просмотров.</p>

        <form>
          <div class="field">
            <label for="email">Электронная почта</label>
            <input id="email" type="email" placeholder="you@example.com">
          </div>
          <div class="field">
            <label for="password">Пароль</label>
            <input id="password" type="password" placeholder="Введите пароль">
          </div>

          <div class="auth-row">
            <span>Запомнить меня</span>
            <a href="#">Забыли пароль?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Войти</button>
        </form>

        <p class="auth-switch">Ещё нет аккаунта? <a href="#">Зарегистрироваться</a></p>
      </div>
    </section>
  </div>

</body>
</html>
